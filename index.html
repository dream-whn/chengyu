<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成語練習室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
/* 版面：頂部分頁列 + 單欄內容；成語以田字格呈現，綠色為主色，朱紅標示錯誤 */
:root{
  --paper:#f3f5f1; --card:#ffffff; --ink:#1c2220; --muted:#5d6762; --line:#d7dcd4;
  --jade:#1f6f5c; --jade-soft:#e0eee8; --seal:#b23a2a; --seal-soft:#f8e4df; --gold:#9a6f0e; --gold-soft:#f7edd3;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111513; --card:#1a201d; --ink:#e7ece9; --muted:#9ba6a0; --line:#2d3632;
    --jade:#55b898; --jade-soft:#17302a; --seal:#e27361; --seal-soft:#3b201b; --gold:#d9ac4a; --gold-soft:#352a12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111513; --card:#1a201d; --ink:#e7ece9; --muted:#9ba6a0; --line:#2d3632;
  --jade:#55b898; --jade-soft:#17302a; --seal:#e27361; --seal-soft:#3b201b; --gold:#d9ac4a; --gold-soft:#352a12;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--jade);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}

header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.seal{width:34px;height:34px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:18px}
.brand h1{font-size:20px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 14px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500}
nav.tabs a:hover{background:var(--jade-soft);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--jade);color:#fff}
nav.tabs a.teacher{border:1px dashed var(--line)}
.who{font-size:14px;color:var(--muted)}

main{padding:28px 0 60px}
.banner{padding:10px 14px;border-radius:8px;background:var(--gold-soft);color:var(--ink);margin-bottom:18px;font-size:15px}
.banner.err{background:var(--seal-soft)}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.section-head h2{font-size:26px}
.sub{color:var(--muted);font-size:15px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid{display:grid;gap:14px}
.grid.cards{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* 田字格 */
.tz{display:inline-flex;gap:3px}
.tz span{width:var(--s,44px);height:var(--s,44px);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:calc(var(--s,44px)*.62);
  border:1.5px solid var(--seal);position:relative;background:
  linear-gradient(var(--seal-soft),var(--seal-soft)) center/100% 1px no-repeat,
  linear-gradient(var(--seal-soft),var(--seal-soft)) center/1px 100% no-repeat, var(--card)}
.tz span.blank{color:var(--jade);background-color:var(--jade-soft)}
.tz.big{--s:72px}
.reading{color:var(--muted);font-size:14px;margin-top:6px}
.meaning{margin:10px 0 0}
.example{margin:8px 0 0;color:var(--muted);font-size:15px;border-left:3px solid var(--jade-soft);padding-left:10px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--jade-soft);color:var(--jade);font-weight:500}
.tag.warn{background:var(--seal-soft);color:var(--seal)}
.tag.ok{background:var(--jade-soft);color:var(--jade)}

.btn{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--jade)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--seal);border-color:var(--seal-soft)}
.btn.danger.armed{background:var(--seal);color:#fff;border-color:var(--seal)}
.btn.small{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=search],select,textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
label.f{display:grid;gap:4px;font-size:14px;color:var(--muted)}
label.f > span{font-weight:500}

/* 練習 */
.quiz{max-width:640px;margin:0 auto}
.progressbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.progressbar i{display:block;height:100%;background:var(--jade);transition:width .3s}
.qtype{font-size:14px;color:var(--jade);font-weight:700;letter-spacing:.05em}
.prompt{font-size:20px;margin:10px 0 20px}
.prompt .sentence{font-size:19px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{padding:14px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-family:var(--display);font-size:22px;font-weight:600;text-align:center}
.opt:hover:not(:disabled){border-color:var(--jade)}
.opt.right{border-color:var(--jade);background:var(--jade-soft)}
.opt.wrong{border-color:var(--seal);background:var(--seal-soft)}
.opt:disabled{cursor:default}
.feedback{margin-top:18px}
.score{font-family:var(--display);font-size:56px;font-weight:900;color:var(--jade);line-height:1}
.setup{display:grid;gap:14px;max-width:560px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mode{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--card);text-align:left}
.mode[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft)}
.mode b{display:block}
.mode small{color:var(--muted)}

/* 數字與表格 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.tile .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:13px;color:var(--muted)}
.tablebox{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:500;white-space:nowrap}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--jade-soft)}
tr:last-child td{border-bottom:none}
.bar{display:inline-block;width:70px;height:8px;border-radius:4px;background:var(--line);vertical-align:middle;margin-right:6px;overflow:hidden}
.bar i{display:block;height:100%}
.ws{font-family:var(--display);font-weight:600}
.subtabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px}
.subtabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{padding:30px;text-align:center;color:var(--muted)}

dialog{border:none;border-radius:14px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:22px;display:grid;gap:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:15px;z-index:20}
/* 錄音 */
.say{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--jade);flex:none;padding:0}
.say:hover{border-color:var(--jade);background:var(--jade-soft)}
.say.playing{background:var(--jade);color:#fff;border-color:var(--jade)}
.say.loading{opacity:.55}
.say svg{width:18px;height:18px}
.recbox{display:grid;gap:12px;justify-items:start}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--seal);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.rectime{font-variant-numeric:tabular-nums;font-weight:700}

/* 闖關 */
.levels{display:grid;gap:12px}
.level{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:16px 18px}
.level .no{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:var(--jade);color:#fff;font-family:var(--display);font-weight:900;font-size:26px;line-height:1}
.level.locked{opacity:.6}
.level.locked .no{background:var(--line);color:var(--muted)}
.level.passed{border-color:var(--jade)}
.level h3{font-size:19px}
.level .info{font-size:14px;color:var(--muted)}
.level .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stars{font-size:20px;letter-spacing:2px;color:#e0ad1c;white-space:nowrap}
.stars .off{color:var(--line)}
.lockline{font-size:13px;color:var(--muted)}
.big-stars{font-size:44px;letter-spacing:6px;color:#e0ad1c;line-height:1}
.big-stars .off{color:var(--line)}
@media (max-width:600px){.level{grid-template-columns:auto 1fr}.level .acts{grid-column:1/-1;justify-content:flex-start}}

/* 學生問候 */
.hello{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px;padding:14px 18px;background:linear-gradient(90deg,var(--jade-soft),var(--card) 70%)}
.hello .avatar{width:48px;height:48px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px;flex:none}
.hello .hname{font-family:var(--display);font-weight:900;font-size:20px;line-height:1.3}
.hello .hmeta{font-size:14px;color:var(--muted)}
.hello .hmeta b{color:var(--ink)}
.hello .hstats{display:flex;gap:20px}
.hello .hstats div{display:grid;text-align:center}
.hello .hstats b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.hello .hstats small{font-size:13px;color:var(--muted)}
.hello .hstats span{font-size:12px;color:var(--muted)}
.hello .lbl{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;color:#fff}
.r1l{background:#b98a0b}.r2l{background:#7f8893}.r3l{background:#a8622a}

/* 首三名：金銀銅牌 */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.podium .card{display:flex;gap:14px;align-items:center;padding:14px 16px;border-width:1.5px}
.medal{position:relative;flex:none;width:46px;height:56px}
.medal .ribbon{position:absolute;top:0;left:50%;width:24px;height:20px;transform:translateX(-50%);
  background:linear-gradient(90deg,#c0392b 0 50%,#1f5fa8 50% 100%);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.medal .disc{position:absolute;bottom:0;left:1px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-weight:900;font-size:19px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.5),0 2px 4px rgba(0,0,0,.18)}
.m1 .disc{background:radial-gradient(circle at 35% 30%,#ffe98a,#e0ad1c 55%,#a97c06)}
.m2 .disc{background:radial-gradient(circle at 35% 30%,#ffffff,#bcc3cc 55%,#7f8893)}
.m3 .disc{background:radial-gradient(circle at 35% 30%,#f6c296,#c97b3a 55%,#8a4f1d)}
.podium .r1{border-color:#e0ad1c}.podium .r2{border-color:#aab2bc}.podium .r3{border-color:#c97b3a}
.podium .nm{font-weight:700;font-size:17px;line-height:1.3}
.podium .lbl{font-size:12px;font-weight:700;margin-right:6px;padding:1px 7px;border-radius:999px;vertical-align:2px;color:#fff}
.r1 .lbl{background:#b98a0b}.r2 .lbl{background:#7f8893}.r3 .lbl{background:#a8622a}
.podium .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.podium .slot{border-style:dashed;color:var(--muted)}
.podium-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.podium-head h3{font-size:18px}
@media (max-width:700px){.podium{grid-template-columns:1fr}}
@media (max-width:520px){.opts{grid-template-columns:1fr}.tz.big{--s:58px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><div class="seal" aria-hidden="true">語</div><h1>成語練習室</h1></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="who" id="who"></div>
</div></header>
<main><div class="wrap" id="app"></div></main>
<dialog id="dlg"></dialog>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script>
const API = (window.CHENGYU_CONFIG && window.CHENGYU_CONFIG.API_URL || '').trim();
const S = {
  idioms:[], idiomsLoaded:false, loadErr:'',
  me:null, myRows:[], my:null,
  pw:null, teacherLoaded:false, all:[], tLoading:false,
  view:'learn', quiz:null, tSub:'students', openStudent:null, filter:'', cat:'',
  practiceMode:'mix', practiceCat:'', practiceCount:10, offline:false, top:null
};
const MAX_RECENT = 60;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pct = (c,t) => t ? Math.round(c/t*100) : 0;
const fmtTime = ms => { if(!ms) return '—'; const d=new Date(ms); const p=n=>String(n).padStart(2,'0'); return `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`; };
const ago = ms => { if(!ms) return '未有紀錄'; const m=Math.floor((Date.now()-ms)/60000); if(m<1) return '剛剛'; if(m<60) return m+' 分鐘前'; const h=Math.floor(m/60); if(h<24) return h+' 小時前'; return Math.floor(h/24)+' 日前'; };
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }
const tz = (word, cls='', blankAt=-1) => `<span class="tz ${cls}">${[...word].map((ch,i)=>i===blankAt?'<span class="blank">？</span>':`<span>${esc(ch)}</span>`).join('')}</span>`;
const byId = id => S.idioms.find(x=>x.id===id);
const cats = () => [...new Set(S.idioms.map(i=>i.category).filter(Boolean))];
const MODE_NAMES = {meaning:'看解釋 選成語', fill:'補上缺字', sentence:'例句填空'};
const LEVEL_NAMES = {1:'起步',2:'熟練',3:'進階',4:'寓言故事',5:'成語高手'};
const CN_NUM = ['零','一','二','三','四','五','六','七','八','九','十'];
const lvTitle = n => `第${CN_NUM[n]||n}關`;
const lvName = n => LEVEL_NAMES[n] || '';
const levelList = () => [...new Set(S.idioms.map(i=>+i.level||0).filter(Boolean))].sort((a,b)=>a-b);
const levelIdioms = n => S.idioms.filter(i=>+i.level===n && i.word && i.meaning);
const lvPlan = n => Math.min(10, levelIdioms(n).length);
const lvNeed = n => Math.ceil(lvPlan(n)*0.8);
const starsFor = (c,n) => !n ? 0 : c>=n ? 3 : c/n>=0.9 ? 2 : c/n>=0.8 ? 1 : 0;
const starsHtml = (k, cls='stars') => `<span class="${cls}" aria-label="${k} 粒星">${'★'.repeat(k)}<span class="off">${'★'.repeat(3-k)}</span></span>`;
const MODE_BY_NAME = Object.fromEntries(Object.entries(MODE_NAMES).map(([k,v])=>[v,k]));
const keyOf = (cls,name) => (cls+'|'+name).replace(/\s+/g,'').toUpperCase();
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let pending = store.get('cy_pending') || [];
let flushing = false;

/* ---------- 與 Google 試算表溝通 ---------- */
async function apiGet(params){
  const u = new URL(API); for (const k in params) u.searchParams.set(k, params[k]);
  const r = await fetch(u); return r.json();
}
async function apiPost(body){
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  return r.json();
}

/* ---------- 錄音播放 ---------- */
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const sayBtn = i => i && i.audio ? `<button type="button" class="say" title="聽讀音" aria-label="播放「${esc(i.word)}」的錄音" onclick="event.stopPropagation();playAudio('${esc(i.audio)}',this)">${SPEAKER}</button>` : '';
const audioCache = new Map();
let player = null, playingBtn = null;
async function audioUrl(fid){
  if (audioCache.has(fid)) return audioCache.get(fid);
  const p = apiGet({action:'audio', f:fid}).then(r=>{
    if (!r.ok) throw new Error(r.error||'未能載入錄音');
    const bin = atob(r.data), u8 = new Uint8Array(bin.length);
    for (let k=0;k<bin.length;k++) u8[k]=bin.charCodeAt(k);
    return URL.createObjectURL(new Blob([u8],{type:r.mime||'audio/wav'}));
  });
  audioCache.set(fid, p);
  p.catch(()=>audioCache.delete(fid));
  return p;
}
async function playAudio(fid, btn){
  if (player){ player.pause(); if (playingBtn) playingBtn.classList.remove('playing'); }
  if (btn) btn.classList.add('loading');
  try {
    const url = await audioUrl(fid);
    player = new Audio(url); playingBtn = btn;
    if (btn){ btn.classList.remove('loading'); btn.classList.add('playing'); }
    player.onended = player.onpause = ()=>{ if (btn) btn.classList.remove('playing'); };
    await player.play();
  } catch(e){ if (btn) btn.classList.remove('loading','playing'); toast('未能播放錄音'); }
}

/* ---------- 路由 ---------- */
const VIEWS = ['learn','challenge','practice','record','teacher'];
function route(){ const h=location.hash.replace('#',''); S.view = VIEWS.includes(h) ? h : 'learn'; if (S.view==='teacher' && S.pw && !S.teacherLoaded) loadTeacher(); render(); }
window.addEventListener('hashchange', route);

/* ---------- 啟動 ---------- */
async function init(){
  S.me = store.get('cy_me');
  if (S.me && !S.me.pin){ S.me = null; store.set('cy_me', null); }   // 舊版沒有密碼，需要重新登入
  try { S.pw = sessionStorage.getItem('cy_pw'); } catch(e){}
  S.top = store.get('cy_top');
  const cached = store.get('cy_idioms');
  if (cached && cached.length){ S.idioms = cached; S.idiomsLoaded = true; }
  rebuildMy();
  route();
  if (!API){ S.idiomsLoaded = true; S.loadErr = 'noapi'; render(); return; }
  loadIdioms();
  loadTop();
  if (S.me) loadMyRecord();
  flush();
}

async function loadIdioms(){
  try {
    const r = await apiGet({action:'idioms'});
    if (!r.ok) throw new Error(r.error);
    S.idioms = r.idioms.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    store.set('cy_idioms', S.idioms); S.loadErr=''; rebuildMy();
  } catch(e){ S.loadErr = S.idioms.length ? 'stale' : 'fail'; }
  S.idiomsLoaded = true; softRender();
}
async function loadTop(){
  if (!API) return;

const MEDALS = [['金','金牌'],['銀','銀牌'],['銅','銅牌']];

    const m = S.my || {}, ls = levelList();
    const mastered = Object.entries(m.byIdiom||{}).filter(([id,b])=>byId(id) && !isWeak(b)).length;
    const passed = ls.filter(n=>m.levels && m.levels[n] && m.levels[n].passed).length;

      <div class="hstats"><div><b>${mastered}</b><span>已掌握成語</span></div>${ls.length?`<div><b>${passed}<small> / ${ls.length}</small></b><span>已過關卡</span></div>`:''}<div><b>${m.total?pct(m.correct,m.total)+'%':'—'}</b><span>正確率</span></div></div>
    </div>`;
  }
  return hi + (showPodium ? podiumHtml(S.top,'成語之星') : '');
}
function podiumHtml(list, title){
  if (!API) return '';
  list = (list || []).slice(0,3);
  const cards = [0,1,2].map(i=>{
    const s = list[i], [ch, label] = MEDALS[i];
    const medal = `<div class="medal m${i+1}" role="img" aria-label="${label}"><span class="ribbon"></span><span class="disc">${ch}</span></div>`;
    if (!s) return `<div class="card slot r${i+1}">${medal}<div><div class="nm">虛位以待</div><div class="meta">多做練習，下一個就是你！</div></div></div>`;
    return `<div class="card r${i+1}">${medal}<div><div class="nm"><span class="lbl">${label}</span>${esc(s.name)}</div><div class="meta">${esc(s.cls)} · 掌握 ${s.mastered} 個 · 正確率 ${s.acc}%</div></div></div>`;
  }).join('');
  return `<section aria-label="${title}"><div class="podium-head"><h3>${title}</h3><span class="sub">按已掌握成語數排名，同分比正確率</span></div><div class="podium">${cards}</div></section>`;
}
function topFromAll(){
  const ids = new Set(S.idioms.map(i=>i.id));
  return S.all.map(s=>({name:s.name, cls:s.cls, total:s.total, acc:pct(s.correct,s.total),
    mastered:Object.entries(s.byIdiom).filter(([id,b])=>ids.has(id) && !isWeak(b)).length}))
    .filter(s=>s.mastered>0).sort((a,b)=>b.mastered-a.mastered||b.acc-a.acc||b.total-a.total).slice(0,3);
}
async function loadMyRecord(){

    if (r.ok){ S.myRows = r.rows; rebuildMy(); softRender(); }

/* 練習進行中時，資料更新不打斷題目 */
function softRender(){ if ((S.view==='practice'||S.view==='challenge') && S.quiz && !S.quiz.done) { renderHeader(); return; } render(); }

/* ---------- 統計 ---------- */
function aggregate(rows){
  const m = {};
  rows.slice().sort((a,b)=>a.t-b.t).forEach(r=>{
    const s = m[r.sid] ||= {id:r.sid, name:r.name, cls:r.cls, total:0, correct:0, lastAt:0, days:new Set(), byIdiom:{}, recent:[]};
    s.name = r.name || s.name; s.cls = r.cls || s.cls;
    s.total++; if (r.ok) s.correct++;
    s.lastAt = Math.max(s.lastAt, r.t); s.days.add(new Date(r.t).toDateString());
    const b = s.byIdiom[r.i] ||= {c:0,w:0}; r.ok ? b.c++ : b.w++; b.last = r.ok ? 1 : 0;
    s.recent.unshift(r);
    if (r.lv && r.ss){ const x = (s.ss ||= {})[r.ss] ||= {lv:r.lv, n:0, c:0}; x.n++; if (r.ok) x.c++; }
  });
  return Object.values(m).map(s=>{
    const levels = {};
    for (const x of Object.values(s.ss||{})){
      const L = levels[x.lv] ||= {tries:0, best:0, stars:0, passed:false};
      L.tries++; L.best = Math.max(L.best, x.c);
      if (x.n >= lvPlan(x.lv) && x.c >= lvNeed(x.lv)){ L.passed = true; L.stars = Math.max(L.stars, starsFor(x.c, lvPlan(x.lv))); }
    }
    return {...s, sessions:s.days.size, recent:s.recent.slice(0,MAX_RECENT), levels};
  });
}
const isWeak = b => b.w > b.c || b.last === 0;
function rebuildMy(){
  if (!S.me){ S.my = null; return; }
  const rows = S.myRows.concat(pending.filter(p=>p.sid===S.me.sid));  // pin 只用於上載
  S.my = aggregate(rows)[0] || {id:S.me.sid, name:S.me.name, cls:S.me.cls, total:0, correct:0, sessions:0, byIdiom:{}, recent:[], levels:{}};
}

/* ---------- 作答紀錄：先存本機，再分批送出 ---------- */
async function flush(){
  if (flushing || !pending.length || !API) return;
  flushing = true;
  try {
    const batch = pending.slice(0, 100);
    const r = await apiPost({action:'answers', rows:batch});
    if (!r.ok) throw new Error(r.error);
    pending = pending.slice(batch.length); store.set('cy_pending', pending);
    if (r.rejected) toast(`有 ${r.rejected} 題紀錄因密碼不符未能儲存`);
    if (!r.rejected) S.myRows = S.myRows.concat(batch.filter(b=>S.me && b.sid===S.me.sid).map(({pin,...x})=>x));
    if (S.offline){ S.offline=false; softRender(); }
  } catch(e){
    if (!S.offline){ S.offline=true; softRender(); }
    flushing = false; setTimeout(flush, 15000); return;
  }
  flushing = false;
  if (pending.length) flush();
}
function recordAnswer(q, ok, chosen){
  const z = S.quiz || {};
  pending.push({t:Date.now(), sid:S.me.sid, pin:S.me.pin, cls:S.me.cls, name:S.me.name, i:q.idiom.id, w:q.idiom.word, m:MODE_NAMES[q.type], ok:ok?1:0, a:chosen, lv:z.level||'', ss:z.ss||''});
  store.set('cy_pending', pending);
  rebuildMy(); flush();
}

let loggingIn = false;
async function takeName(){
  const nm=$('#sname'), cl=$('#scls'), pn=$('#spin');
  if (!nm) return !!S.me;
  const name=nm.value.trim(), cls=cl.value.trim().toUpperCase(), pin=pn.value.trim();

  if (!name || !cls){ toast('請先填姓名和班別學號'); return false; }
  if (!/^\d{4}$/.test(pin)){ toast('密碼要是 4 位數字'); pn.focus(); return false; }
  if (loggingIn) return false;
  loggingIn = true;
  try {
    const r = await apiPost({action:'studentLogin', cls, name, pin});
    if (!r.ok){ toast(r.error || '未能登入'); pn.value=''; pn.focus(); return false; }
    S.me = {name:r.name, cls:r.cls, sid:r.sid, pin}; store.set('cy_me', S.me);

    S.myRows = []; rebuildMy(); loadMyRecord(); return true;
  } catch(e){ toast('需要連接網絡才可以登入'); return false; }

}
function pickMode(k){ const a=$('#sname'),b=$('#scls'); if(a){S.draftName=a.value;S.draftCls=b.value;} const c=$('#pcat'); if(c) S.practiceCat=c.value; const n=$('#pcount'); if(n) S.practiceCount=+n.value; S.practiceMode=k; render(); }
/* ---------- 闖關 ---------- */
function levelOpen(n){
  const ls = levelList(), k = ls.indexOf(n);
  if (k <= 0) return true;
  const prev = S.my && S.my.levels[ls[k-1]];
  return !!(prev && prev.passed);
}
function viewChallenge(){
  if (S.quiz) return S.quiz.done ? quizResult() : quizQuestion();
  const ls = levelList();
  if (!ls.length) return studentTop() + `<div class="card empty">老師仍未為成語設定級別。<br>（老師：在 Apps Script 執行一次 assignLevels，或在後台修改成語時選擇級別。）</div>`;
  const L = (S.my && S.my.levels) || {};
  const passedN = ls.filter(n=>L[n] && L[n].passed).length;

  return `${studentTop()}
  <div class="section-head"><div><h2>成語闖關</h2><div class="sub">每關 ${lvPlan(ls[0])} 題，答對 8 成就過關，並解鎖下一關。全對可得三粒星。</div></div>
    ${S.me?`<div class="row"><span class="tag ok">已過 ${passedN} / ${ls.length} 關</span><span class="stars">★</span><b>${starN}</b><span class="sub">/ ${ls.length*3}</span></div>`:''}</div>
  ${!S.me?`<form class="card setup" style="margin-bottom:16px" onsubmit="event.preventDefault();takeName().then(ok=>ok&&render())"><h2 style="font-size:20px">學生登入</h2>${nameFields()}<div><button class="btn primary" type="submit">登入</button></div></form>`:''}
  <div class="levels">${ls.map(n=>{
    const st = L[n] || {}, open = levelOpen(n), cnt = levelIdioms(n).length;
    const cls = !open ? 'locked' : st.passed ? 'passed' : '';
    return `<div class="card level ${cls}">
      <div class="no" aria-hidden="true">${open?CN_NUM[n]||n:'鎖'}</div>
      <div><h3>${lvTitle(n)}　${esc(lvName(n))}</h3>
        <div class="info">${cnt} 個成語${st.tries?` · 挑戰 ${st.tries} 次 · 最佳 ${st.best} / ${lvPlan(n)}`:''}</div>
        ${open?'':`<div class="lockline">先通過${lvTitle(levelList()[levelList().indexOf(n)-1])}才可以挑戰</div>`}</div>
      <div class="acts">${st.passed?starsHtml(st.stars):''}
        <button class="btn small" onclick="S.lvFilter=${n};S.cat='';S.filter='';location.hash='#learn'">溫習本關</button>
        <button class="btn small ${open?'primary':''}" ${open?'':'disabled'} onclick="startChallenge(${n})">${st.passed?'再挑戰':'開始挑戰'}</button></div>
    </div>`; }).join('')}</div>`;
}
function startChallenge(n){
  if (!S.me){ toast('請先填姓名和班別學號'); return; }
  if (!levelOpen(n)) return;
  const pool = levelIdioms(n);
  if (pool.length < 1) return;
  S.quiz = {qs:buildQuestions(pool, lvPlan(n), 'mix'), i:0, score:0, answered:null, log:[], level:n, ss:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)};
  render(); window.scrollTo(0,0);
}
function buildQuestions(pool, n, mode){
  const all = S.idioms.filter(i=>i.word && i.meaning);
  const picks = shuffle(pool).slice(0, n);
  const charPool = [...new Set(all.flatMap(i=>[...i.word]))];
  const filler = [...'一不人心天大無自如之以其而為千萬百'];
  return picks.map(idiom=>{
    const types = ['meaning','fill'];
    if (idiom.example && idiom.example.includes(idiom.word)) types.push('sentence');
    let type = mode==='mix'||mode==='wrong' ? types[Math.floor(Math.random()*types.length)] : mode;
    if (type==='sentence' && !types.includes('sentence')) type='meaning';
    if (type==='fill'){
      const chars=[...idiom.word], k=Math.floor(Math.random()*chars.length), ans=chars[k];
      const dis = shuffle([...charPool,...filler].filter(ch=>ch!==ans && !chars.includes(ch))).slice(0,3);
      return {type, idiom, blank:k, answer:ans, options:shuffle([ans,...dis])};
    }
    const others = shuffle(all.filter(i=>i.id!==idiom.id && i.word!==idiom.word)).slice(0,3).map(i=>i.word);
    return {type, idiom, answer:idiom.word, options:shuffle([idiom.word,...others])};
  });
}
async function startQuiz(ev){
  ev.preventDefault();
  if (!(await takeName())) return;
  const pc=$('#pcat'); S.practiceCat = pc ? pc.value : '';
  S.practiceCount = +$('#pcount').value;
  let pool = S.idioms.filter(i=>i.word && i.meaning && (!S.practiceCat || i.category===S.practiceCat));
  if (S.practiceMode==='wrong'){ const bi=S.my.byIdiom; pool = pool.filter(i=>bi[i.id] && isWeak(bi[i.id])); }
  if (S.practiceMode==='sentence') pool = pool.filter(i=>i.example && i.example.includes(i.word));
  if (!pool.length){ toast(S.practiceMode==='sentence'?'未有成語附有例句，請選其他題型':'這個選擇沒有可用的成語'); render(); return; }
  S.quiz = {qs:buildQuestions(pool, S.practiceCount, S.practiceMode), i:0, score:0, answered:null, log:[]};
  render();
}
function quizQuestion(){
  const z=S.quiz, q=z.qs[z.i];
  let prompt='';
  if (q.type==='meaning') prompt = `<div class="prompt">${esc(q.idiom.meaning)}</div>`;
  if (q.type==='fill') prompt = `<div class="prompt">${tz(q.idiom.word,'big',q.blank)}<p class="sub" style="margin-top:12px">提示：${esc(q.idiom.meaning)}</p></div>`;
  if (q.type==='sentence') prompt = `<div class="prompt"><span class="sentence">${esc(q.idiom.example).replaceAll(esc(q.idiom.word), '<b style="color:var(--jade)">＿＿＿＿</b>')}</span></div>`;
  const a = z.answered;
  const opts = q.options.map((o,idx)=>{
    let cls='opt'; if (a){ if (o===q.answer) cls+=' right'; else if (o===a) cls+=' wrong'; }
    return `<button class="${cls}" ${a?'disabled':''} onclick="answer(${idx})">${esc(o)}</button>`;
  }).join('');
  const fb = a ? `<div class="feedback card" style="border-color:${a===q.answer?'var(--jade)':'var(--seal)'}">
      <b style="color:${a===q.answer?'var(--jade)':'var(--seal)'}">${a===q.answer?'答對了！':'答錯了，正確答案是「'+esc(q.idiom.word)+'」'}</b>
      <div class="row" style="margin-top:8px">${tz(q.idiom.word)}${sayBtn(q.idiom)}${q.idiom.reading?`<span class="reading" style="margin:0">${esc(q.idiom.reading)}</span>`:''}</div>
      <p class="meaning">${esc(q.idiom.meaning)}</p>${q.idiom.example?`<p class="example">${esc(q.idiom.example)}</p>`:''}
      <div style="margin-top:12px"><button class="btn primary" id="nextBtn" onclick="nextQ()">${z.i+1<z.qs.length?'下一題':'看成績'}</button></div></div>` : '';
  return `<div class="quiz">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="qtype">${z.level?lvTitle(z.level)+' · ':''}${MODE_NAMES[q.type]}</span><span class="sub">第 ${z.i+1} / ${z.qs.length} 題 · 答對 ${z.score}</span></div>
    <div class="progressbar"><i style="width:${(z.i+(a?1:0))/z.qs.length*100}%"></i></div>
    ${prompt}<div class="opts">${opts}</div>${fb}
    <div style="margin-top:22px"><button class="btn small" onclick="S.quiz=null;render()">${z.level?'放棄這次挑戰':'結束練習'}</button></div>
  </div>`;
}
function answer(idx){
  const z=S.quiz, q=z.qs[z.i]; if (z.answered) return;
  const chosen=q.options[idx]; z.answered=chosen;
  const ok = chosen===q.answer; if (ok) z.score++;
  z.log.push({q, ok, chosen});
  recordAnswer(q, ok, chosen);
  render(); const nb=$('#nextBtn'); if(nb) nb.focus();
}
function nextQ(){ const z=S.quiz; z.answered=null; z.i++; if (z.i>=z.qs.length){ z.done=true; setTimeout(loadTop, 2500); } render(); }
function quizResult(){
  const z=S.quiz, wrong=z.log.filter(l=>!l.ok);
  if (z.level) return challengeResult(z, wrong);
  return `<div class="quiz card" style="display:grid;gap:14px">
    <div class="row" style="gap:18px"><div class="score">${z.score}<span style="font-size:24px;color:var(--muted)"> / ${z.qs.length}</span></div>
      <div><h2 style="font-size:22px">${z.score===z.qs.length?'全部答對，好厲害！':pct(z.score,z.qs.length)>=70?'做得不錯！':'繼續努力！'}</h2><div class="sub">正確率 ${pct(z.score,z.qs.length)}%</div></div></div>
    ${wrong.length?`<div><h3 style="font-size:17px;margin-bottom:8px">要再溫習的成語</h3><div class="grid">${wrong.map(l=>`<div class="row" style="align-items:flex-start;gap:12px;border-top:1px solid var(--line);padding-top:10px">${tz(l.q.idiom.word)}${sayBtn(l.q.idiom)}<div style="flex:1;min-width:180px"><div>${esc(l.q.idiom.meaning)}</div><div class="sub">你選了：${esc(l.chosen)}</div></div></div>`).join('')}</div></div>`:''}
    <div class="row"><button class="btn primary" onclick="S.quiz=null;render()">再練一次</button>${wrong.length?`<button class="btn" onclick="S.practiceMode='wrong';S.quiz=null;render()">只練錯題</button>`:''}</div>
  </div>`;
}

function wrongList(wrong){
  return wrong.length?`<div><h3 style="font-size:17px;margin-bottom:8px">要再溫習的成語</h3><div class="grid">${wrong.map(l=>`<div class="row" style="align-items:flex-start;gap:12px;border-top:1px solid var(--line);padding-top:10px">${tz(l.q.idiom.word)}<div style="flex:1;min-width:180px"><div>${esc(l.q.idiom.meaning)}</div><div class="sub">你選了：${esc(l.chosen)}</div></div></div>`).join('')}</div></div>`:'';
}
function challengeResult(z, wrong){
  const n=z.level, total=z.qs.length, need=Math.ceil(total*0.8), pass=z.score>=need, k=starsFor(z.score,total);
  const ls=levelList(), next=ls[ls.indexOf(n)+1];
  return `<div class="quiz card" style="display:grid;gap:16px;text-align:center">
    <div class="sub">${lvTitle(n)}　${esc(lvName(n))}</div>
    ${starsHtml(k,'big-stars')}
    <h2 style="font-size:26px">${pass?(k===3?'全部答對，完美過關！':'過關了！'):'差一點點，再試一次！'}</h2>
    <div><span class="score" style="font-size:44px">${z.score}</span><span class="sub"> / ${total}　（要答對 ${need} 題過關）</span></div>
    ${pass&&next?`<div class="tag ok" style="justify-self:center;font-size:15px;padding:4px 14px">已解鎖${lvTitle(next)}</div>`:''}
    ${pass&&!next?`<div class="tag ok" style="justify-self:center;font-size:15px;padding:4px 14px">你已完成所有關卡！</div>`:''}
    <div style="text-align:left">${wrongList(wrong)}</div>
    <div class="row" style="justify-content:center">
      ${pass&&next?`<button class="btn primary" onclick="startChallenge(${next})">挑戰${lvTitle(next)}</button>`:''}
      <button class="btn ${pass&&next?'':'primary'}" onclick="startChallenge(${n})">${pass?'再挑戰爭取更多星':'再挑戰'}</button>
      <button class="btn" onclick="S.quiz=null;render()">返回關卡</button>
    </div></div>`;
}

/* ---------- 我的紀錄 ---------- */
function viewRecord(){
  if (!S.me) return `<form class="card setup" style="margin:0 auto" onsubmit="event.preventDefault();takeName().then(ok=>ok&&render())"><h2 style="font-size:22px">學生登入</h2>${nameFields()}<div><button class="btn primary" type="submit">登入</button></div></form>`;
  const m=S.my;
  if (!m.total) return `<div class="card empty">你仍未有練習紀錄。<div style="margin-top:12px"><a class="btn primary" href="#practice" style="text-decoration:none">去練習</a></div></div>`;

  return `

    <div class="tile"><div class="n">${rows.filter(r=>!isWeak(r.b)).length}</div><div class="l">已掌握成語</div></div>
    <div class="tile"><div class="n" style="color:var(--seal)">${weak.length}</div><div class="l">要再溫習</div></div>
    ${levelList().length?`<div class="tile"><div class="n">${levelList().filter(n=>m.levels[n]&&m.levels[n].passed).length}<span style="font-size:16px;color:var(--muted)"> / ${levelList().length}</span></div><div class="l">已過關卡</div></div>`:''}
  </div>
  ${weak.length?`<h3 style="font-size:18px;margin-bottom:10px">要再溫習</h3><div class="grid cards" style="margin-bottom:24px">${weak.map(r=>cardHtml(r.i)).join('')}</div>`:''}
  <h3 style="font-size:18px;margin-bottom:10px">最近作答</h3>

function recentTable(rec){
  if (!rec.length) return '<div class="card empty">未有作答。</div>';
  return `<div class="tablebox"><table><thead><tr><th>時間</th><th>成語</th><th>題型</th><th>結果</th><th>所選答案</th></tr></thead><tbody>
  ${rec.map(r=>`<tr><td class="num">${fmtTime(r.t)}</td><td class="ws">${esc((byId(r.i)||{}).word||r.w||'（已刪除）')}</td><td>${esc(r.m)}</td><td>${r.ok?'<span class="tag ok">對</span>':'<span class="tag warn">錯</span>'}</td><td>${esc(r.a||'')}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ---------- 老師後台 ---------- */
async function loadTeacher(){
  if (!API || S.tLoading) return;
  S.tLoading = true; softRender();
  try {
    const r = await apiPost({action:'teacherData', pw:S.pw});
    if (!r.ok){ if (r.auth || /密碼/.test(r.error||'')){ S.pw=null; try{sessionStorage.removeItem('cy_pw')}catch(e){} S.tErr=r.error; } else toast('載入失敗：'+r.error); }
    else {
      S.idioms = r.idioms.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); store.set('cy_idioms', S.idioms);
      S.all = aggregate(r.log); S.teacherLoaded = true; S.loadedAt = Date.now(); S.tErr='';
      S.registered = Object.fromEntries((r.students||[]).map(x=>[x.sid,x]));
      // 已登記但未作答的學生也列出
      for (const x of (r.students||[])) if (!S.all.some(s=>s.id===x.sid)) S.all.push({id:x.sid, name:x.name, cls:x.cls, total:0, correct:0, lastAt:0, sessions:0, byIdiom:{}, recent:[], levels:{}});
      loadTop();
    }
  } catch(e){ toast('未能連接 Google 試算表'); }
  S.tLoading = false; softRender();
}
function teacherLogin(ev){
  ev.preventDefault();
  S.pw = $('#tpw').value; try{ sessionStorage.setItem('cy_pw', S.pw); }catch(e){}
  S.teacherLoaded = false; loadTeacher();
}
function teacherLogout(){ S.pw=null; S.teacherLoaded=false; S.all=[]; try{sessionStorage.removeItem('cy_pw')}catch(e){} render(); }
function viewTeacher(){
  if (!API) return '<div class="card empty">未設定後端。</div>';
  if (!S.pw) return `<form class="card setup" onsubmit="teacherLogin(event)" style="margin:0 auto">
    <h2 style="font-size:22px">老師登入</h2>
    ${S.tErr?`<div class="banner err" style="margin:0">${esc(S.tErr)}</div>`:''}
    <label class="f"><span>老師密碼</span><input type="password" id="tpw" required autocomplete="current-password"></label>
    <div><button class="btn primary" type="submit">登入</button></div></form>`;
  if (!S.teacherLoaded) return `<div class="empty">${S.tLoading?'正在讀取試算表…':'未能載入。'}</div>`;
  const sub = S.tSub;
  const tabs = [['students','學生情況'],['levels','闖關進度'],['idioms','成語庫'],['hard','成語難度']];

  <div class="subtabs">${tabs.map(([k,l])=>`<button aria-pressed="${sub===k}" onclick="S.tSub='${k}';S.openStudent=null;render()">${l}</button>`).join('')}</div>${body}`;
}
const sortStudents = arr => arr.slice().sort((a,b)=>(a.cls||'').localeCompare(b.cls||'','zh-Hant',{numeric:true}) || (a.name||'').localeCompare(b.name||'','zh-Hant'));
function teacherStudents(){
  const st = S.all.filter(s=>s.total>0);
  if (S.openStudent){ const s=S.all.find(x=>x.id===S.openStudent); if (s) return studentDetail(s); }
  const idle = S.all.filter(s=>!s.total);
  const week = Date.now()-7*864e5;
  const tot = st.reduce((a,s)=>a+s.total,0), cor = st.reduce((a,s)=>a+s.correct,0);
  return `<div class="tiles">
    <div class="tile"><div class="n">${st.length}</div><div class="l">有練習的學生</div></div>

    <div class="tile"><div class="n">${tot}</div><div class="l">總作答題數</div></div>
    <div class="tile"><div class="n">${pct(cor,tot)}%</div><div class="l">整體正確率</div></div>
  </div>
  ${S.topMissing?'<div class="banner err">Google Apps Script 仍是舊版程式，學生在首頁看不到首三名。請把新的 Code.gs 貼上，再按「部署 → 管理部署作業 → 編輯 → 新版本 → 部署」。</div>':''}
  ${podiumHtml(topFromAll(),'首三名（學生在首頁會看到）')}
  ${st.length?`<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="sub">按一行看該學生的詳細紀錄</span><button class="btn small" onclick="downloadCsv()">下載成績 (CSV)</button></div>
  <div class="tablebox"><table><thead><tr><th>班別學號</th><th>姓名</th><th>作答題數</th><th>練習日數</th><th>正確率</th><th>闖關</th><th>要溫習</th><th>最後練習</th></tr></thead><tbody>
  ${sortStudents(st).map((s,ix)=>{ const p=pct(s.correct,s.total); const weak=Object.values(s.byIdiom).filter(isWeak).length;
    return `<tr class="click" tabindex="0" onclick="openStu(${ix})" onkeydown="if(event.key==='Enter')openStu(${ix})">
    <td>${esc(s.cls||'—')}</td><td>${esc(s.name)}</td><td class="num">${s.total}</td><td class="num">${s.sessions}</td>
    <td class="num"><span class="bar"><i style="width:${p}%;background:${p>=70?'var(--jade)':p>=50?'var(--gold)':'var(--seal)'}"></i></span>${p}%</td>
    <td class="num">${passedCount(s)} / ${levelList().length}</td>
    <td class="num">${weak?`<span class="tag warn">${weak} 個</span>`:'—'}</td><td class="num">${ago(s.lastAt)}</td></tr>`; }).join('')}
  </tbody></table></div>`:'<div class="card empty">仍未有學生練習。把網址給學生，他們做練習後按「重新整理」就會看到。</div>'}
  ${idle.length?`<p class="sub" style="margin-top:16px">已登入但未作答：${idle.map(s=>`<a href="#teacher" onclick="event.preventDefault();S.openStudent='${esc(s.id)}';render()">${esc(s.cls)} ${esc(s.name)}</a>`).join('、')}</p>`:''}`;
}
const passedCount = s => levelList().filter(n=>s.levels[n]&&s.levels[n].passed).length;
function openStu(ix){ S.openStudent = sortStudents(S.all.filter(s=>s.total>0))[ix].id; render(); window.scrollTo(0,0); }
function studentDetail(s){
  const rows = Object.entries(s.byIdiom).map(([id,b])=>({id,b,w:(byId(id)||{}).word})).filter(r=>r.w).sort((a,b)=>(b.b.w-b.b.c)-(a.b.w-a.b.c));
  return `<button class="btn small" onclick="S.openStudent=null;render()">← 返回學生列表</button>
  <h3 style="font-size:22px;margin:14px 0 4px">${esc(s.cls)} ${esc(s.name)}</h3>
  <div class="sub" style="margin-bottom:14px">最後練習：${fmtTime(s.lastAt)}（${ago(s.lastAt)}）</div>
  <div class="tiles"><div class="tile"><div class="n">${s.total}</div><div class="l">作答題數</div></div>
    <div class="tile"><div class="n">${pct(s.correct,s.total)}%</div><div class="l">正確率</div></div>
    <div class="tile"><div class="n">${s.sessions}</div><div class="l">練習日數</div></div>
    <div class="tile"><div class="n">${rows.length}</div><div class="l">做過的成語</div></div></div>
  ${levelList().length?`<h3 style="font-size:17px;margin-bottom:8px">闖關進度</h3>
  <div class="tablebox" style="margin-bottom:22px"><table><thead><tr><th>關卡</th><th>挑戰次數</th><th>最佳成績</th><th>狀態</th></tr></thead><tbody>
  ${levelList().map(n=>{ const L=s.levels[n]||{}; return `<tr><td>${lvTitle(n)} ${esc(lvName(n))}</td><td class="num">${L.tries||0}</td><td class="num">${L.tries?L.best+' / '+lvPlan(n):'—'}</td><td>${L.passed?starsHtml(L.stars):L.tries?'<span class="tag warn">未過關</span>':'<span class="sub">未挑戰</span>'}</td></tr>`; }).join('')}
  </tbody></table></div>`:''}
  <h3 style="font-size:17px;margin-bottom:8px">逐個成語表現</h3>
  <div class="tablebox" style="margin-bottom:22px"><table><thead><tr><th>成語</th><th>答對</th><th>答錯</th><th>最近一次</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="ws">${esc(r.w)}</td><td class="num">${r.b.c}</td><td class="num">${r.b.w}</td><td>${r.b.last?'<span class="tag ok">對</span>':'<span class="tag warn">錯</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">未有紀錄</td></tr>'}
  </tbody></table></div>
  <h3 style="font-size:17px;margin-bottom:8px">最近作答（最多 ${MAX_RECENT} 題）</h3>
  ${recentTable(s.recent)}
  <div class="card" style="margin-top:22px;display:grid;gap:10px">
    <div><b>學生密碼：</b>${S.registered&&S.registered[s.id]?'已設定':'<span class="sub">未設定（學生下次登入時會設定新密碼）</span>'}</div>
    <div class="row">${S.registered&&S.registered[s.id]?`<button class="btn" onclick="armDelete(this, ()=>resetPin(S.openStudent))">重設密碼</button>`:''}
      <button class="btn danger" onclick="armDelete(this, ()=>resetStudent(S.openStudent))">清除此學生的作答紀錄</button></div>
    <div class="sub">重設密碼後，學生下次登入時輸入的 4 位數字會成為新密碼；作答紀錄會保留。</div>

}
async function resetPin(sid){
  try { const r = await apiPost({action:'resetPin', pw:S.pw, sid}); if(!r.ok) throw new Error(r.error); toast('已重設密碼'); loadTeacher(); }
  catch(e){ toast('未能重設：'+e.message); }
}
async function resetStudent(sid){
  try { const r = await apiPost({action:'clearStudent', pw:S.pw, sid}); if(!r.ok) throw new Error(r.error); S.openStudent=null; toast('已清除'); loadTeacher(); }
  catch(e){ toast('未能清除：'+e.message); }
}
function downloadCsv(){
  const head=['班別學號','姓名','作答題數','練習日數','正確率(%)','已過關卡','要溫習成語','最後練習'];
  const lines=[head].concat(sortStudents(S.all.filter(s=>s.total>0)).map(s=>[s.cls,s.name,s.total,s.sessions,pct(s.correct,s.total),passedCount(s),
    Object.entries(s.byIdiom).filter(([,b])=>isWeak(b)).map(([id])=>(byId(id)||{}).word).filter(Boolean).join('、'), fmtTime(s.lastAt)]));
  const csv='﻿'+lines.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const d=new Date(); a.download=`成語練習成績_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function teacherLevels(){
  const ls = levelList();
  if (!ls.length) return '<div class="card empty">成語仍未設定級別。請在 Apps Script 執行一次 assignLevels，或在「成語庫」修改成語時選擇級別。</div>';
  const st = S.all;
  return `<p class="sub" style="margin-top:0">每關 ${lvPlan(ls[0])} 題，答對 8 成過關。</p>
  <div class="tablebox" style="margin-bottom:22px"><table><thead><tr><th>關卡</th><th>成語數</th><th>挑戰過的學生</th><th>已過關</th><th>過關率</th></tr></thead><tbody>
  ${ls.map(n=>{ const tried=st.filter(s=>s.levels[n]).length, passed=st.filter(s=>s.levels[n]&&s.levels[n].passed).length, p=pct(passed,tried);
    return `<tr><td>${lvTitle(n)} ${esc(lvName(n))}</td><td class="num">${levelIdioms(n).length}</td><td class="num">${tried}</td><td class="num">${passed}</td>
    <td class="num">${tried?`<span class="bar"><i style="width:${p}%;background:${p>=70?'var(--jade)':p>=40?'var(--gold)':'var(--seal)'}"></i></span>${p}%`:'<span class="sub">未有人挑戰</span>'}</td></tr>`; }).join('')}
  </tbody></table></div>
  ${st.length?`<h3 style="font-size:17px;margin-bottom:8px">每位學生</h3><div class="tablebox"><table><thead><tr><th>班別學號</th><th>姓名</th>${ls.map(n=>`<th>${lvTitle(n)}</th>`).join('')}</tr></thead><tbody>
  ${sortStudents(st).map(s=>`<tr><td>${esc(s.cls)}</td><td>${esc(s.name)}</td>${ls.map(n=>{ const L=s.levels[n]; return `<td>${L&&L.passed?starsHtml(L.stars):L?'<span class="tag warn">未過</span>':'<span class="sub">—</span>'}</td>`; }).join('')}</tr>`).join('')}
  </tbody></table></div>`:''}`;
}
function teacherHard(){
  const agg={};
  for (const s of S.all) for (const [id,b] of Object.entries(s.byIdiom)){ const a=agg[id] ||= {c:0,w:0,n:0}; a.c+=b.c; a.w+=b.w; a.n++; }
  const rows = S.idioms.map(i=>({i, a:agg[i.id]||{c:0,w:0,n:0}})).sort((x,y)=>{ const ex=x.a.c+x.a.w, ey=y.a.c+y.a.w; return (ey?y.a.w/ey:-1)-(ex?x.a.w/ex:-1); });
  if (!rows.length) return '<div class="card empty">成語庫是空的。</div>';
  return `<p class="sub" style="margin-top:0">按答錯率排列，最難的在最上面，適合用來決定堂上要重溫哪些成語。</p>
  <div class="tablebox"><table><thead><tr><th>成語</th><th>做過的學生</th><th>作答次數</th><th>答錯率</th></tr></thead><tbody>
  ${rows.map(({i,a})=>{ const t=a.c+a.w, e=pct(a.w,t); return `<tr><td class="ws">${esc(i.word)}</td><td class="num">${a.n}</td><td class="num">${t}</td>
   <td class="num">${t?`<span class="bar"><i style="width:${e}%;background:${e>=50?'var(--seal)':e>=30?'var(--gold)':'var(--jade)'}"></i></span>${e}%`:'<span class="sub">未有人做</span>'}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function teacherIdioms(){
  return `<div class="row" style="margin-bottom:14px"><button class="btn primary" onclick="editIdiom()">＋ 新增成語</button><button class="btn" onclick="bulkImport()">批量匯入</button><span class="sub">共 ${S.idioms.length} 個 · 已錄音 ${S.idioms.filter(i=>i.audio).length} 個 · 亦可直接在 Google 試算表「成語」工作表修改</span></div>
  ${S.idioms.length?`<div class="tablebox"><table><thead><tr><th>成語</th><th>錄音</th><th>解釋</th><th>例句</th><th>分類／關卡</th><th></th></tr></thead><tbody>
  ${S.idioms.slice().reverse().map(i=>`<tr><td class="ws" style="white-space:nowrap">${esc(i.word)}${i.reading?`<div class="reading" style="margin:0;font-family:var(--body);font-weight:400">${esc(i.reading)}</div>`:''}</td>
  <td style="white-space:nowrap"><div class="row" style="gap:6px;flex-wrap:nowrap">${sayBtn(i)}<button class="btn small" onclick="recordDialog('${esc(i.id)}')">${i.audio?'重錄':'錄音'}</button></div></td><td>${esc(i.meaning)}</td><td class="sub">${esc(i.example||'')}${i.example && !i.example.includes(i.word)?'<div><span class="tag warn">例句未包含此成語，不會出例句題</span></div>':''}</td><td>${i.category?`<span class="tag">${esc(i.category)}</span>`:''}${i.level?`<div style="margin-top:4px"><span class="tag" style="background:var(--gold-soft);color:var(--gold)">${lvTitle(+i.level)}</span></div>`:''}</td>
  <td style="white-space:nowrap"><button class="btn small" onclick="editIdiom('${esc(i.id)}')">修改</button> <button class="btn small danger" onclick="armDelete(this, ()=>delIdiom('${esc(i.id)}'))">刪除</button></td></tr>`).join('')}
  </tbody></table></div>`:'<div class="card empty">未有成語，按「新增成語」或「批量匯入」開始。</div>'}`;
}
function armDelete(btn, fn){
  if (btn.classList.contains('armed')) { btn.disabled=true; fn(); return; }
  btn.classList.add('armed'); const old=btn.textContent; btn.textContent='確定？再按一次';
  setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove('armed'); btn.textContent=old; } }, 3500);
}
async function delIdiom(id){
  try { const r=await apiPost({action:'deleteIdiom', pw:S.pw, id}); if(!r.ok) throw new Error(r.error);
    S.idioms = S.idioms.filter(x=>x.id!==id); store.set('cy_idioms', S.idioms); toast('已刪除'); render(); }
  catch(e){ toast('未能刪除：'+e.message); render(); }
}
function editIdiom(id){
  const i = id ? byId(id) : {};
  const d=$('#dlg');
  d.innerHTML = `<form class="dlg" id="idf">
    <h2 style="font-size:22px">${id?'修改成語':'新增成語'}</h2>
    <div class="row" style="gap:12px"><label class="f" style="flex:1;min-width:140px"><span>成語 *</span><input type="text" id="f_word" required maxlength="12" value="${esc(i.word)}"></label>
      <label class="f" style="flex:1;min-width:140px"><span>讀音（粵拼／拼音，可留空）</span><input type="text" id="f_reading" value="${esc(i.reading)}"></label></div>
    <label class="f"><span>解釋 *</span><textarea id="f_meaning" required>${esc(i.meaning)}</textarea></label>
    <label class="f"><span>例句（要包含成語本身，才會出例句填空題）</span><textarea id="f_example">${esc(i.example)}</textarea></label>
    <div class="row" style="gap:12px"><label class="f" style="flex:1;min-width:160px"><span>分類</span><input type="text" id="f_cat" list="catlist" value="${esc(i.category)}"><datalist id="catlist">${cats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
    <label class="f" style="width:170px"><span>闖關級別</span><select id="f_lv"><option value="0">不放入闖關</option>${[1,2,3,4,5,6,7,8].map(n=>`<option value="${n}" ${+i.level===n?'selected':''}>${lvTitle(n)} ${esc(lvName(n))}</option>`).join('')}</select></label></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" onclick="$('#dlg').close()">取消</button><button class="btn primary" type="submit" id="fsave">儲存</button></div>
  </form>`;
  d.showModal();
  $('#idf').onsubmit = async ev => {
    ev.preventDefault();
    const data = { id:id||'', word:$('#f_word').value.trim(), reading:$('#f_reading').value.trim(), meaning:$('#f_meaning').value.trim(),
      example:$('#f_example').value.trim(), category:$('#f_cat').value.trim(), level:+$('#f_lv').value||0, createdAt:i.createdAt||Date.now() };
    if (!data.word || !data.meaning) return;
    $('#fsave').disabled = true; $('#fsave').textContent='儲存中…';
    try {
      const r = await apiPost({action:'saveIdiom', pw:S.pw, idiom:data});
      if (!r.ok) throw new Error(r.error);
      data.id = r.id; data.audio = i.audio || '';
      const k = S.idioms.findIndex(x=>x.id===data.id);
      if (k>=0) S.idioms[k]=data; else S.idioms.push(data);
      store.set('cy_idioms', S.idioms); d.close(); toast('已儲存'); render();
    } catch(e){ toast(e.message||'未能儲存'); $('#fsave').disabled=false; $('#fsave').textContent='儲存'; }
  };
}
/* ---------- 老師錄音 ---------- */
const MAX_REC = 15;
function blobToBase64(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.onerror=rej; fr.readAsDataURL(blob); }); }
async function toWav(blob){
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC(); const buf = await ac.decodeAudioData(await blob.arrayBuffer()); ac.close && ac.close();
  const rate = 22050, len = Math.max(1, Math.ceil(buf.duration*rate));
  const off = new OfflineAudioContext(1, len, rate); const src = off.createBufferSource();
  src.buffer = buf; src.connect(off.destination); src.start();
  const data = (await off.startRendering()).getChannelData(0);
  let peak = 0; for (let k=0;k<data.length;k++) peak = Math.max(peak, Math.abs(data[k]));
  const gain = peak > 0.01 ? Math.min(0.95/peak, 4) : 1;   // 自動調整音量
  const dv = new DataView(new ArrayBuffer(44 + data.length*2));
  const w = (o,str)=>{ for (let k=0;k<str.length;k++) dv.setUint8(o+k, str.charCodeAt(k)); };
  w(0,'RIFF'); dv.setUint32(4, 36+data.length*2, true); w(8,'WAVE'); w(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,rate,true);
  dv.setUint32(28,rate*2,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,'data'); dv.setUint32(40,data.length*2,true);
  for (let k=0;k<data.length;k++){ const v=Math.max(-1,Math.min(1,data[k]*gain)); dv.setInt16(44+k*2, v<0?v*0x8000:v*0x7fff, true); }
  return new Blob([dv], {type:'audio/wav'});
}
function recordDialog(id){
  const i = byId(id); if (!i) return;
  const d = $('#dlg');
  const R = {stream:null, rec:null, chunks:[], blob:null, ext:'wav', mime:'audio/wav', url:null, t0:0, timer:null};
  d.innerHTML = `<div class="dlg">
    <h2 style="font-size:22px">錄音：${esc(i.word)}</h2>
    <div class="row" style="gap:10px">${tz(i.word)}${i.reading?`<span class="reading" style="margin:0">${esc(i.reading)}</span>`:''}</div>
    <div class="recbox">
      <div class="row"><button class="btn primary" id="rStart">● 開始錄音</button><button class="btn" id="rStop" hidden>■ 停止</button>
        <span id="rStatus" class="sub">按「開始錄音」後讀出成語，最長 ${MAX_REC} 秒。</span></div>
      <div class="row" id="rReview" hidden><button class="btn" id="rPlay">▶ 試聽</button><span class="sub" id="rInfo"></span></div>
      <label class="f"><span>或者上載錄音檔（mp3、m4a、wav）</span><input type="file" id="rFile" accept="audio/*"></label>
    </div>
    <div class="sub" id="rMsg"></div>
    <div class="row" style="justify-content:space-between">
      <div>${i.audio?'<button class="btn danger" id="rDel">刪除錄音</button>':''}</div>
      <div class="row"><button class="btn" id="rCancel">取消</button><button class="btn primary" id="rSave" disabled>儲存錄音</button></div>
    </div></div>`;
  d.showModal();
  const stopStream = ()=>{ if (R.stream){ R.stream.getTracks().forEach(t=>t.stop()); R.stream=null; } clearInterval(R.timer); };
  const ready = (blob, info)=>{ R.blob=blob; if (R.url) URL.revokeObjectURL(R.url); R.url=URL.createObjectURL(blob);
    $('#rReview').hidden=false; $('#rInfo').textContent=info; $('#rSave').disabled=false; };
  d.onclose = ()=>{ stopStream(); if (R.rec && R.rec.state!=='inactive') try{R.rec.stop()}catch(e){} };
  $('#rCancel').onclick = ()=>d.close();
  $('#rStart').onclick = async ()=>{
    if (!navigator.mediaDevices || !window.MediaRecorder){ $('#rMsg').textContent='這個瀏覽器不支援錄音，請改用 Chrome 或 Safari，或上載錄音檔。'; return; }
    try { R.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
    catch(e){ $('#rMsg').textContent='未能使用咪高峰。請在瀏覽器網址列旁允許「麥克風」權限，然後再試。'; return; }
    const type = ['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t));
    R.chunks = []; R.rec = new MediaRecorder(R.stream, type?{mimeType:type}:undefined);
    R.rec.ondataavailable = e=>{ if (e.data.size) R.chunks.push(e.data); };
    R.rec.onstop = async ()=>{
      stopStream(); $('#rStart').hidden=false; $('#rStop').hidden=true; $('#rStatus').textContent='處理中…';
      try { const raw = new Blob(R.chunks, {type:R.rec.mimeType||type||'audio/webm'}); const wav = await toWav(raw);
        R.ext='wav'; R.mime='audio/wav'; ready(wav, `錄音長 ${((Date.now()-R.t0)/1000).toFixed(1)} 秒`); $('#rStatus').textContent='錄好了，可以試聽或重錄。';
        $('#rStart').textContent='● 重錄'; }
      catch(e){ $('#rStatus').textContent='處理錄音時出錯，請再試一次。'; }
    };
    R.rec.start(); R.t0 = Date.now();
    $('#rStart').hidden=true; $('#rStop').hidden=false; $('#rReview').hidden=true; $('#rSave').disabled=true;
    const tick = ()=>{ const sec=(Date.now()-R.t0)/1000; $('#rStatus').innerHTML=`<span class="recdot"></span>錄音中 <span class="rectime">${sec.toFixed(1)}</span> 秒`; if (sec>=MAX_REC) $('#rStop').click(); };
    tick(); R.timer = setInterval(tick, 200);
  };
  $('#rStop').onclick = ()=>{ if (R.rec && R.rec.state==='recording') R.rec.stop(); };
  $('#rPlay').onclick = ()=>{ if (R.url){ const a=new Audio(R.url); a.play().catch(()=>{}); } };
  $('#rFile').onchange = ()=>{
    const f = $('#rFile').files[0]; if (!f) return;
    if (f.size > 5*1024*1024){ $('#rMsg').textContent='檔案太大，請用 5MB 以下的錄音檔。'; return; }
    R.mime = f.type || 'audio/mpeg'; R.ext = (f.name.split('.').pop()||'mp3').toLowerCase();
    ready(f, `已選擇 ${f.name}`);
  };
  $('#rSave').onclick = async ()=>{
    if (!R.blob) return;
    $('#rSave').disabled=true; $('#rSave').textContent='上載中…'; $('#rMsg').textContent='';
    try {
      const r = await apiPost({action:'saveAudio', pw:S.pw, id:i.id, mime:R.mime, ext:R.ext, data:await blobToBase64(R.blob)});
      if (!r.ok) throw new Error(r.error);
      audioCache.set(r.audio, Promise.resolve(R.url)); R.url = null;
      i.audio = r.audio; store.set('cy_idioms', S.idioms); d.close(); toast('已儲存錄音'); render();
    } catch(e){
      $('#rMsg').textContent = /權限|permission|authoriz|403|401|雲端硬碟錯誤/i.test(e.message) ? '後端未有雲端硬碟權限：請在 Apps Script 執行一次 setup 並允許存取，然後部署新版本。（'+e.message+'）' : '未能儲存：'+e.message;
      $('#rSave').disabled=false; $('#rSave').textContent='儲存錄音';
    }
  };
  const del = $('#rDel');
  if (del) del.onclick = ()=>armDelete(del, async ()=>{
    try { const r = await apiPost({action:'deleteAudio', pw:S.pw, id:i.id}); if (!r.ok) throw new Error(r.error);
      i.audio=''; store.set('cy_idioms', S.idioms); d.close(); toast('已刪除錄音'); render(); }
    catch(e){ $('#rMsg').textContent='未能刪除：'+e.message; }
  });
}
function bulkImport(){
  const d=$('#dlg');
  d.innerHTML = `<form class="dlg" id="bf">
    <h2 style="font-size:22px">批量匯入成語</h2>
    <p class="sub" style="margin:0">每行一個成語，用「|」或 Tab 分隔：<br><b>成語 | 解釋 | 例句 | 分類 | 讀音 | 級別</b>（後面四項可留空；級別填 1 至 5）。可直接由 Excel 複製貼上。</p>
    <textarea id="bt" style="min-height:200px" placeholder="守株待兔 | 比喻妄想不勞而獲，或死守狹隘經驗，不知變通。 | 做生意要主動開拓客源，不能守株待兔。 | 動物寓言"></textarea>
    <div class="sub" id="bmsg"></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn" onclick="$('#dlg').close()">取消</button><button class="btn primary" type="submit" id="bgo">匯入</button></div>
  </form>`;
  d.showModal();
  $('#bf').onsubmit = async ev => {
    ev.preventDefault();
    const items = $('#bt').value.split('\n').map(l=>l.split(/\t|\||｜/).map(x=>x.trim())).filter(p=>p[0]&&p[1])
      .map(p=>({word:p[0], meaning:p[1], example:p[2]||'', category:p[3]||'', reading:p[4]||'', level:parseInt(p[5])||0}));
    if (!items.length){ $('#bmsg').textContent='每行最少要有成語和解釋。'; return; }
    $('#bgo').disabled=true; $('#bmsg').textContent='匯入中…';
    try {
      const r = await apiPost({action:'bulkIdioms', pw:S.pw, items});
      if (!r.ok) throw new Error(r.error);
      d.close(); toast(`已匯入 ${r.added} 個成語`+(r.skipped?`（略過 ${r.skipped} 個重複）`:'')); loadTeacher();
    } catch(e){ $('#bmsg').textContent='未能匯入：'+e.message; $('#bgo').disabled=false; }
  };
}
init();
